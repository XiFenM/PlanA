<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="850" viewBox="0 0 1000 850" role="img" aria-labelledby="title desc">
  <title id="title">y 等于 a 乘 b 后进行 ReLU 的反向图</title>
  <desc id="desc">反向图从输出 y 对应的 ReluBackward0 开始，经过 MulBackward0，分支到叶子 Tensor a 和 b 对应的 AccumulateGrad 节点，最终把梯度累加到 a.grad 和 b.grad。</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#16a34a"/>
    </marker>
    <style>
      .text { font-family: Inter, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #475569; }
      .node-title { font-size: 19px; font-weight: 700; }
      .node-body { font-size: 15px; fill: #334155; }
      .edge-label { font-size: 14px; fill: #6d28d9; }
      .note-title { font-size: 16px; font-weight: 700; fill: #9f1239; }
      .note-body { font-size: 14px; fill: #881337; }
      .footer { font-size: 14px; fill: #475569; }
    </style>
  </defs>

  <rect width="1000" height="850" fill="#ffffff"/>
  <text class="text title" x="500" y="48" text-anchor="middle">y = (a * b).relu()：反向图</text>
  <text class="text subtitle" x="500" y="78" text-anchor="middle">箭头表示 backward 时梯度从输出一侧流向叶子 Tensor</text>

  <rect x="350" y="106" width="300" height="86" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
  <text class="text node-title" x="500" y="140" text-anchor="middle">输出 Tensor y</text>
  <text class="text node-body" x="500" y="169" text-anchor="middle">grad_fn = ReluBackward0</text>

  <rect x="380" y="250" width="240" height="78" rx="13" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text class="text node-title" x="500" y="282" text-anchor="middle">ReluBackward0</text>
  <text class="text node-body" x="500" y="308" text-anchor="middle">计算 ReLU 的局部 VJP</text>

  <rect x="680" y="244" width="260" height="88" rx="12" fill="#fff1f2" stroke="#fb7185" stroke-width="1.5"/>
  <text class="text note-title" x="810" y="276" text-anchor="middle">saved for backward</text>
  <text class="text note-body" x="810" y="305" text-anchor="middle">保存输出 y 即可判断激活区域</text>

  <rect x="380" y="408" width="240" height="78" rx="13" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text class="text node-title" x="500" y="440" text-anchor="middle">MulBackward0</text>
  <text class="text node-body" x="500" y="466" text-anchor="middle">计算乘法的局部 VJP</text>

  <rect x="680" y="402" width="260" height="88" rx="12" fill="#fff1f2" stroke="#fb7185" stroke-width="1.5"/>
  <text class="text note-title" x="810" y="434" text-anchor="middle">saved for backward</text>
  <text class="text note-body" x="810" y="463" text-anchor="middle">保存乘法输入 a、b</text>

  <rect x="120" y="572" width="270" height="74" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
  <text class="text node-title" x="255" y="603" text-anchor="middle">AccumulateGrad(a)</text>
  <text class="text node-body" x="255" y="628" text-anchor="middle">将梯度累加到 a.grad</text>

  <rect x="610" y="572" width="270" height="74" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
  <text class="text node-title" x="745" y="603" text-anchor="middle">AccumulateGrad(b)</text>
  <text class="text node-body" x="745" y="628" text-anchor="middle">将梯度累加到 b.grad</text>

  <rect x="120" y="710" width="270" height="78" rx="12" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text class="text node-title" x="255" y="742" text-anchor="middle">叶子 Tensor a</text>
  <text class="text node-body" x="255" y="769" text-anchor="middle">a.grad_fn = None</text>

  <rect x="610" y="710" width="270" height="78" rx="12" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text class="text node-title" x="745" y="742" text-anchor="middle">叶子 Tensor b</text>
  <text class="text node-body" x="745" y="769" text-anchor="middle">b.grad_fn = None</text>

  <path d="M500 192 L500 242" fill="none" stroke="#7c3aed" stroke-width="2.7" marker-end="url(#arrow)"/>
  <path d="M500 328 L500 400" fill="none" stroke="#7c3aed" stroke-width="2.7" marker-end="url(#arrow)"/>
  <text class="text edge-label" x="520" y="368">next_functions</text>
  <path d="M465 486 C440 525 330 525 270 564" fill="none" stroke="#7c3aed" stroke-width="2.7" marker-end="url(#arrow)"/>
  <path d="M535 486 C560 525 670 525 730 564" fill="none" stroke="#7c3aed" stroke-width="2.7" marker-end="url(#arrow)"/>
  <path d="M255 646 L255 702" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <path d="M745 646 L745 702" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrow-green)"/>

  <path d="M680 288 L628 288" fill="none" stroke="#fb7185" stroke-width="1.8" stroke-dasharray="6 5"/>
  <path d="M680 446 L628 446" fill="none" stroke="#fb7185" stroke-width="1.8" stroke-dasharray="6 5"/>

  <text class="text footer" x="500" y="829" text-anchor="middle">反向图中的 AccumulateGrad 节点与叶子 Tensor 的 grad_fn 属性不是同一个概念。</text>
</svg>
