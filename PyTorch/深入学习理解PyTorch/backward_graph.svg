<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580" role="img" aria-labelledby="title desc">
  <title id="title">c 等于 a 加 b 时 Tensor 与反向节点的关系</title>
  <desc id="desc">输出 Tensor c 的 grad_fn 指向 AddBackward0。AddBackward0 的 next_functions 指向叶子 Tensor a 和 b 对应的 AccumulateGrad 节点，而叶子 Tensor 自身的 grad_fn 为 None。</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#16a34a"/>
    </marker>
    <style>
      .text { font-family: Inter, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #475569; }
      .node-title { font-size: 19px; font-weight: 700; }
      .node-body { font-size: 15px; fill: #334155; }
      .edge-label { font-size: 14px; fill: #475569; }
      .note { font-size: 15px; fill: #475569; }
    </style>
  </defs>

  <rect width="1000" height="580" fill="#ffffff"/>
  <text class="text title" x="500" y="48" text-anchor="middle">c = a + b：Tensor 与反向节点的关系</text>
  <text class="text subtitle" x="500" y="78" text-anchor="middle">箭头沿反向图从输出一侧指向叶子 Tensor</text>

  <rect x="55" y="220" width="235" height="118" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
  <text class="text node-title" x="172" y="258" text-anchor="middle">输出 Tensor c</text>
  <text class="text node-body" x="172" y="291" text-anchor="middle">requires_grad = True</text>
  <text class="text node-body" x="172" y="318" text-anchor="middle">grad_fn = AddBackward0</text>

  <rect x="375" y="229" width="230" height="100" rx="14" fill="#fdf2f8" stroke="#db2777" stroke-width="2" filter="url(#shadow)"/>
  <text class="text node-title" x="490" y="270" text-anchor="middle">AddBackward0</text>
  <text class="text node-body" x="490" y="301" text-anchor="middle">加法对应的反向节点</text>

  <rect x="700" y="108" width="235" height="72" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.7"/>
  <text class="text node-title" x="818" y="139" text-anchor="middle">AccumulateGrad(a)</text>
  <text class="text node-body" x="818" y="163" text-anchor="middle">负责写入 a.grad</text>

  <rect x="700" y="198" width="235" height="88" rx="12" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text class="text node-title" x="818" y="231" text-anchor="middle">叶子 Tensor a</text>
  <text class="text node-body" x="818" y="260" text-anchor="middle">a.grad_fn = None</text>

  <rect x="700" y="328" width="235" height="72" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.7"/>
  <text class="text node-title" x="818" y="359" text-anchor="middle">AccumulateGrad(b)</text>
  <text class="text node-body" x="818" y="383" text-anchor="middle">负责写入 b.grad</text>

  <rect x="700" y="418" width="235" height="88" rx="12" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text class="text node-title" x="818" y="451" text-anchor="middle">叶子 Tensor b</text>
  <text class="text node-body" x="818" y="480" text-anchor="middle">b.grad_fn = None</text>

  <path d="M290 279 L367 279" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text class="text edge-label" x="329" y="263" text-anchor="middle">c.grad_fn</text>

  <path d="M605 259 C645 259 650 144 692 144" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M605 299 C645 299 650 364 692 364" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text class="text edge-label" x="644" y="221" text-anchor="middle">next_functions</text>

  <path d="M818 180 L818 190" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <path d="M818 400 L818 410" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrow-green)"/>

  <rect x="105" y="526" width="790" height="36" rx="9" fill="#f8fafc"/>
  <text class="text note" x="500" y="550" text-anchor="middle">叶子 Tensor 的 grad_fn 为 None，但反向图仍通过独立的 AccumulateGrad 节点把梯度累加到 .grad。</text>
</svg>
